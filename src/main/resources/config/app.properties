# SmartSpace configuration. Every key can be overridden by an environment variable:
#   SMARTSPACE_<KEY IN UPPER CASE, dots become underscores>   e.g. SMARTSPACE_DB_URL
# or by a file called smartspace.properties in the folder where the app is started.

# Database configuration: Supabase PostgreSQL (Cloud IPv4 Pooler)
db.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
db.user=postgres.ezcojvjsshecapesrsxs
db.password=

# ---- Supabase Cloud Settings -----------------------------------------------------------------
# URL of your Supabase project. Override with SMARTSPACE_SUPABASE_URL env var.
supabase.url=https://ezcojvjsshecapesrsxs.supabase.co
# Publishable (anon) key — safe to include in client apps; RLS enforces access control.
# Never put the service-role key here.
supabase.anonKey=sb_publishable_HtKqhJZUoxqyYcB7ldXF1Q_HpJaB8gN

# Comma separated list of accepted institutional e-mail domains.
# sakec.onmicrosoft.com is the Microsoft 365 tenant used for student accounts
# (format: firstname.lastnameYY@sakec.onmicrosoft.com).
# sakec.ac.in is retained for faculty/coordinator accounts.
auth.allowedDomains=sakec.onmicrosoft.com,sakec.ac.in
auth.maxFailedAttempts=5
auth.lockMinutes=10

# Self-registration: domains that students are allowed to use when signing up themselves.
# Only sakec.onmicrosoft.com is accepted for student self-registration.
auth.studentDomains=sakec.onmicrosoft.com

# Configurable branch list for student self-registration (pipe-separated).
auth.branches=Computer Engineering|Information Technology|Computer Science and Engineering (Cyber Security)|Artificial Intelligence and Data Science|Electronics and Computer Science|Electronics and Telecommunication Engineering|Electronics Engineering (VLSI Design and Technology)|Electronics and Communication (Advanced Communication Technology)

# Operating hours used for utilization percentages (24 h clock)
ops.startHour=8
ops.endHour=18

# Floor-map polling interval (10 seconds to 1 hour; local SQLite changes only)
map.refreshSeconds=30

# Set true to turn animations off (also: -Dsmartspace.reducedMotion=true)
ui.reducedMotion=false

# Optional SMTP mail settings. When mail.enabled=false, no emails are sent.
mail.enabled=false
mail.smtp.host=
mail.smtp.port=587
mail.smtp.starttls=true
mail.smtp.auth=false
mail.smtp.username=
mail.smtp.password=
mail.smtp.from=

# Development only: create sample users, rooms and timetable when the database is empty.
seed.dev=false
