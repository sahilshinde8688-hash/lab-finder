# SmartSpace configuration. Every key can be overridden by an environment variable:
#   SMARTSPACE_<KEY IN UPPER CASE, dots become underscores>   e.g. SMARTSPACE_DB_URL
# or by a file called smartspace.properties in the folder where the app is started.

# SQLite database file (created automatically on first start)
db.url=jdbc:sqlite:smartspace.db

# Comma separated list of accepted institutional e-mail domains.
# VERIFY this with the college IT department before real use.
auth.allowedDomains=sakec.ac.in
auth.maxFailedAttempts=5
auth.lockMinutes=10

# Operating hours used for utilization percentages (24 h clock)
ops.startHour=8
ops.endHour=18

# Set true to turn animations off (also: -Dsmartspace.reducedMotion=true)
ui.reducedMotion=false

# Development only: create sample users, rooms and timetable when the database is empty.
seed.dev=false
